// LookingGlass wire protocol.
//
// Spoken as protocol version 3 (see ProtocolInfo.CurrentVersion): version 2 brought the signed
// membership log, and version 3 key recovered entries, which a version 2 client would refuse as
// an unknown kind of entry. What each version added, and how changes are made without a new
// version, is described in docs/design.md, under "Protocol and extensibility" ("Versions" and
// "Adding features").
//
// Rules for changing this file:
//   * Within a protocol version, changes are additive only: new fields, new oneof cases, new enum
//     values. Never renumber or reuse a field number.
//   * Removing a field or changing its meaning requires a new protocol version.
//
// Transport: one binary WebSocket message per frame. The client sends
// ClientFrame, the server sends ServerFrame.

syntax = "proto3";

package lookingglass.v1;

option csharp_namespace = "LookingGlass.Protocol";

// ---------------------------------------------------------------- framing

message ClientFrame {
  // Chosen by the client, unique per connection. Echoed in the Response.
  uint32 request_id = 1;

  oneof body {
    Hello hello = 10;
    Ping ping = 11;
    StartRegistration start_registration = 12;
    CompleteRegistration complete_registration = 13;
    Authenticate authenticate = 14;
    GetIdentities get_identities = 15;
    LookupUser lookup_user = 16;
    ListChannels list_channels = 17;
    CreateChannel create_channel = 18;
    InviteMember invite_member = 19;
    RespondToInvite respond_to_invite = 20;
    LeaveChannel leave_channel = 21;
    KickMember kick_member = 22;
    SetMemberRank set_member_rank = 23;
    DisbandChannel disband_channel = 24;
    RenameChannel rename_channel = 25;
    SubmitRekey submit_rekey = 26;
    FetchEpochKeys fetch_epoch_keys = 27;
    SendMessage send_message = 28;
    FetchMembershipLog fetch_membership_log = 29;
    StartKeyLogin start_key_login = 30;
    CompleteKeyLogin complete_key_login = 31;
    RetireIdentity retire_identity = 32;
    ForgetChannel forget_channel = 33;
    FetchMessages fetch_messages = 34;
    SendLocalMessage send_local_message = 35;
  }
}

message ServerFrame {
  oneof body {
    Response response = 1;
    Event event = 2;
  }
}

message Response {
  uint32 request_id = 1;

  oneof result {
    Error error = 2;
    Welcome welcome = 10;
    Pong pong = 11;
    RegistrationChallenge registration_challenge = 12;
    RegistrationComplete registration_complete = 13;
    AuthenticateOk authenticate_ok = 14;
    Identities identities = 15;
    ChannelList channel_list = 16;
    ChannelInfo channel = 17;
    Ack ack = 18;
    EpochKeys epoch_keys = 19;
    MembershipLog membership_log = 20;
    KeyLoginChallenge key_login_challenge = 21;
    KeyLoginComplete key_login_complete = 22;
    StoredMessages stored_messages = 23;
  }
}

message Event {
  // Increases by one for every event on a connection, so gaps are detectable.
  uint64 seq = 1;

  // 12 was MemberChanged, which the server could make up. Membership now comes from the signed log.
  reserved 12;

  oneof kind {
    Announcement announcement = 10;
    InviteReceived invite_received = 11;
    RekeyNeeded rekey_needed = 13;
    EpochAdvanced epoch_advanced = 14;
    ChatMessage chat_message = 15;
    ChannelRenamed channel_renamed = 16;
    ChannelRemoved channel_removed = 17;
    InviteRevoked invite_revoked = 18;
    LogEntryAdded log_entry_added = 19;
    PresenceChanged presence_changed = 20;
    LocalMessage local_message = 21;
  }
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_NOT_AUTHENTICATED = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_FORBIDDEN = 4;
  ERROR_CODE_RATE_LIMITED = 5;
  ERROR_CODE_TOO_LARGE = 6;
  ERROR_CODE_LIMIT_REACHED = 7;
  // The request referred to an old epoch; refresh keys and retry.
  ERROR_CODE_EPOCH_STALE = 8;
  // Membership changed and the channel must be rekeyed before sending.
  ERROR_CODE_REKEY_REQUIRED = 9;
  // A concurrent change won (for example two members rekeyed at once).
  ERROR_CODE_CONFLICT = 10;
  ERROR_CODE_UNSUPPORTED_VERSION = 11;
  ERROR_CODE_REGISTRATION_FAILED = 12;
  ERROR_CODE_INTERNAL = 13;
  // The server's operator blocked this character, or the address the connection comes from
  // (Error.block says which, and why). The server closes the connection after this answer.
  // Added without a version change: an older plugin shows the message, which says it all,
  // and reconnects as after any failed connection.
  ERROR_CODE_BLOCKED = 14;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  // With ERROR_CODE_BLOCKED: the block. Added without a version change.
  Block block = 3;
}

// A block (ban) made by the server's operator.
message Block {
  // What the operator gave as the reason, as they wrote it; empty if they gave none.
  string reason = 1;
  // When the block ends, in Unix seconds; 0 if it lasts until the operator lifts it.
  int64 until_unix = 2;
  // The block is on the address the connection comes from (everyone sharing it), not the character.
  bool address = 3;
}

message Ack {}

// ---------------------------------------------------------------- handshake

message Hello {
  repeated uint32 protocol_versions = 1;
  string client_version = 2;
  repeated string capabilities = 3;
}

message Limits {
  uint32 max_frame_bytes = 1;
  uint32 max_message_bytes = 2;
  uint32 max_members_per_channel = 3;
  uint32 max_channels_per_user = 4;
  uint32 messages_per_second = 5;
  uint32 message_burst = 6;
  uint32 max_pending_invites_per_channel = 7;
  // The most user IDs one GetIdentities may ask for; clients split larger lookups.
  // 0 (an older server) means unknown.
  uint32 max_identities_per_request = 8;
  // Message catch-up (capability "history.v1"): how many days the server keeps the messages it relays, and how many per
  // channel at most (the oldest go first). 0 for both if it keeps none (an older server, or one whose operator turned it
  // off). Added without a version change.
  uint32 message_keep_days = 9;
  uint32 max_stored_messages_per_channel = 10;
  // Local chat (capability "local.v1"): the most recipients one SendLocalMessage may name. 0 if the server doesn't offer
  // local chat (an older server, or one whose operator turned it off). Added without a version change.
  uint32 max_local_recipients = 11;
}

message Welcome {
  uint32 protocol_version = 1;
  string server_version = 2;
  repeated string capabilities = 3;
  Limits limits = 4;
  string announcement = 5;
  // True when the server accepts debug accounts (world "Debug").
  bool debug_accounts_enabled = 6;
  // The addresses the server's operator configured as its own (LookingGlass:PublicUrls),
  // for example "wss://chat.example.com/ws"; empty if none. A client that has an identity
  // for this server and is moving to another address asks the server, over the address
  // it already uses, and only carries its identity over if the new address's origin is
  // listed here (and the server at the new address lists the old one). Added in 0.2
  // without a version change: older servers send none.
  repeated string public_urls = 7;
}

message Ping {}

message Pong {
  int64 server_time_unix_ms = 1;
}

// ---------------------------------------------------------------- identity

message Character {
  string name = 1;
  uint32 world_id = 2;
  string world_name = 3;
}

message User {
  // Lodestone character ID. Debug accounts use negative IDs.
  int64 user_id = 1;
  string name = 2;
  uint32 world_id = 3;
  string world_name = 4;
}

message IdentityBundle {
  // Ed25519 public key, 32 bytes.
  bytes signing_public_key = 1;
  // X25519 public key used to seal keys to this user, 32 bytes.
  bytes agreement_public_key = 2;
  // Ed25519 signature by signing_public_key over the agreement key binding.
  bytes binding_signature = 3;
}

message UserIdentity {
  User user = 1;
  IdentityBundle identity = 2;
  // Increments every time the user re-registers with a new identity.
  uint32 key_version = 3;
}

message StartRegistration {
  Character character = 1;
  IdentityBundle identity = 2;
  // The server's address exactly as the client connected to it, as in CompleteRegistration. The code is derived from
  // its origin, so the server only issues one for an address that is its own (checked as for CompleteRegistration,
  // except for debug accounts). Without it (an older plugin), registering is refused, asking to update. Added in 0.2
  // without a version change.
  string server_url = 3;
  // 32 random bytes, fresh for each StartRegistration, which the code is derived from too (after the server's nonce).
  // A server can't know it in advance, so one passing on another server's code can't search for a match ahead of time:
  // only between this request and the client giving up waiting. Any other length is refused; without it (an older
  // plugin), registering is refused, asking to update. Added in 0.2 without a version change.
  bytes client_nonce = 4;
}

message RegistrationChallenge {
  // Text the user places in their Lodestone profile: "LGC-" and 20 characters in groups of four, derived from the
  // origin of StartRegistration.server_url, identity.signing_public_key, nonce, StartRegistration.client_nonce and
  // lodestone_id (see
  // LookingGlass.Core.Crypto.LodestoneCode), so the client can recompute it from its own address and key and refuse a
  // code made for another server or key (one a malicious server passes on from another). Empty for debug accounts.
  string code = 1;
  int64 expires_unix = 2;
  int64 lodestone_id = 3;
  // True for debug accounts: CompleteRegistration skips Lodestone.
  bool verification_skipped = 4;
  // 32 random bytes, fresh for each StartRegistration and only usable on this connection,
  // for CompleteRegistration to sign. Added in 0.2 without a version change.
  bytes nonce = 5;
}

// Completes the registration started on this same connection, proving that the client
// holds the private key of the identity it registers: anyone can fetch another user's
// public identity bundle, and must not be able to register it as theirs. Without a
// signature (a plugin from before 0.2 sends none), it is refused, asking to update.
message CompleteRegistration {
  // The server's address exactly as the client connected to it, as in CompleteKeyLogin.
  // For a registration through the Lodestone, checked the way key login checks it, so a
  // registration made for one server can't be relayed to another.
  string server_url = 1;
  // Ed25519 signature by the identity signing key being registered over the challenge's
  // nonce, the user ID (RegistrationChallenge.lodestone_id) and the server URL (see
  // LookingGlass.Core.Crypto.RegistrationProof).
  bytes signature = 2;
  // Ed25519 signature by the identity signing key being registered over the user ID and the keys (see
  // LookingGlass.Core.Crypto.KeyRecoveryProof): the keys' consent to take over the account's places in its channels,
  // which goes into each key recovered entry the registration appends. Every place of the account (but for those removed
  // from its list) under other keys moves to these, rank kept. The server refuses a registration that would move any
  // without it, asking to update. Added in protocol version 3.
  bytes recovery_signature = 3;
}

message RegistrationComplete {
  string device_token = 1;
  User user = 2;
  // How many places in channels (memberships and invites) moved to the keys just registered: the account had them
  // under other keys (see MEMBERSHIP_ENTRY_KIND_KEY_RECOVERED). Added in protocol version 3.
  uint32 places_restored = 3;
}

message Authenticate {
  string device_token = 1;
}

message AuthenticateOk {
  User user = 1;
  uint32 key_version = 2;
}

// Key login: a user the server knows gets a new device token by signing a challenge with
// their current identity key, instead of registering again through the Lodestone (say,
// after the server lost their device token). Allowed before logging in, like registration.
// Other devices' tokens are kept.
message StartKeyLogin {
  int64 user_id = 1;
}

// Issued on, and only usable on, the connection that asked for it, once, until it expires.
message KeyLoginChallenge {
  // 32 random bytes.
  bytes challenge = 1;
  int64 expires_unix = 2;
}

message CompleteKeyLogin {
  // The challenge being answered, as received.
  bytes challenge = 1;
  // The server's address exactly as the client connected to it (for example
  // "wss://chat.example.com/ws"). Signed, and checked by the server against its
  // configured public addresses (LookingGlass:PublicUrls; a Development server without
  // them goes by the Host header, which proves nothing against a relay), so a signature
  // made for one server can't be replayed to another.
  string server_url = 2;
  // Ed25519 signature by the user's identity key over the challenge, user ID and
  // server URL (see LookingGlass.Core.Crypto.KeyLoginProof).
  bytes signature = 3;
}

// As RegistrationComplete: the client then sends Authenticate with the token.
message KeyLoginComplete {
  string device_token = 1;
  User user = 2;
}

// "Reset my identity", sent first while logged in: retires the account's current identity
// key. The server deletes every device of the account (this connection's login included,
// which is logged out) and never lets the key sign in or be registered again; the account
// then has no valid login until new keys are registered through the Lodestone. Others keep
// seeing the old key until then, as with any registration. Answered with Ack. Added in 0.2
// without a version change: an older server answers "Unknown request.", and the client
// resets locally anyway.
message RetireIdentity {
  // Ed25519 signature by the account's current identity key over the user ID, the SHA-256
  // of the device token this connection logged in with and the server URL (see
  // LookingGlass.Core.Crypto.RetireIdentityProof), so a stolen login alone can't retire
  // the identity, and a signature made for one login, or for another server (user IDs
  // are the same on every server), doesn't work here.
  bytes signature = 1;
  // The server's address exactly as the client connected to it, as in CompleteKeyLogin,
  // and checked the same way.
  string server_url = 2;
}

message GetIdentities {
  repeated int64 user_ids = 1;
}

message LookupUser {
  string name = 1;
  string world_name = 2;
}

message Identities {
  repeated UserIdentity identities = 1;
}

// ---------------------------------------------------------------- channels

enum Rank {
  RANK_UNSPECIFIED = 0;
  RANK_INVITED = 1;
  RANK_MEMBER = 2;
  RANK_MODERATOR = 3;
  RANK_ADMIN = 4;
}

// ---------------------------------------------------------------- membership log
//
// Every membership change is an entry in a hash-chained log per channel, signed
// by the member who made it. Clients replay the log to work out the members, their
// ranks and their keys, and never take the server's word for any of them (see
// LookingGlass.Core.Membership). The server checks entries the same way before
// storing them, but only as a courtesy.

enum MembershipEntryKind {
  MEMBERSHIP_ENTRY_KIND_UNSPECIFIED = 0;
  // Entry 0: the creator, who becomes admin.
  MEMBERSHIP_ENTRY_KIND_GENESIS = 1;
  // By a moderator or admin, for someone who isn't a member or invited.
  MEMBERSHIP_ENTRY_KIND_INVITE = 2;
  // By the invitee, with the exact key the invite names.
  MEMBERSHIP_ENTRY_KIND_ACCEPT = 3;
  // By the invitee.
  MEMBERSHIP_ENTRY_KIND_DECLINE = 4;
  // By a moderator or admin.
  MEMBERSHIP_ENTRY_KIND_CANCEL_INVITE = 5;
  // By a moderator or admin, for a member ranked below them.
  MEMBERSHIP_ENTRY_KIND_REMOVE = 6;
  // By the leaving member, unless they are the admin and others remain.
  MEMBERSHIP_ENTRY_KIND_LEAVE = 7;
  // By the admin: makes a member a moderator, or a moderator a member.
  MEMBERSHIP_ENTRY_KIND_SET_RANK = 8;
  // By the admin: the subject becomes admin and the actor a moderator.
  MEMBERSHIP_ENTRY_KIND_TRANSFER_ADMIN = 9;
  // Appended by the server, never sent by a client: the subject re-verified their character through the Lodestone with
  // new identity keys (a new computer, a lost secrets file, "Reset my identity"), so their place (a member's, rank kept,
  // or an open invite) moves from the keys in subject to new_keys. Its signature is new_keys' over the user ID and the
  // new keys (see LookingGlass.Core.Crypto.KeyRecoveryProof), not over the entry: whoever holds them agrees to be that
  // user. That the user is who they say is the server's word (it checked the Lodestone), which clients can't check:
  // see the design doc, "Recovering an identity". Added in protocol version 3.
  MEMBERSHIP_ENTRY_KIND_KEY_RECOVERED = 10;
}

// A user as the log knows them: the identity keys that membership is bound to.
// A member who registers again with new keys keeps their place only through a key recovered entry.
message MemberKey {
  int64 user_id = 1;
  bytes signing_public_key = 2;
  bytes agreement_public_key = 3;
}

// A point in a channel's log: an entry's sequence number and hash.
message LogPosition {
  uint64 seq = 1;
  bytes hash = 2;
}

message MembershipEntry {
  string channel_id = 1;
  uint64 seq = 2;
  // Hash of entry seq - 1; empty for the genesis entry.
  bytes previous_hash = 3;
  MembershipEntryKind kind = 4;
  int64 actor_id = 5;
  // SHA-256 of the actor's identity keys, as hashed for their fingerprint (see MemberKeys.Hash).
  bytes actor_key_hash = 6;
  MemberKey subject = 7;
  // Genesis: admin. Set rank: the new rank. Unspecified otherwise.
  Rank rank = 8;
  int64 timestamp_unix_ms = 9;
  // Accept, decline and cancel: the invite entry they answer.
  LogPosition invite = 10;
  // Key recovered: the keys the subject's place moves to (user_id the subject's). The actor is the subject, by these
  // keys (actor_key_hash is theirs); subject has the keys the place had. Absent otherwise.
  MemberKey new_keys = 11;
  // The actor's signature over everything above (see MembershipEntries.SigningPayload); for a key recovered entry,
  // new_keys' signature over the user ID and those keys (see KeyRecoveryProof), made when registering them.
  bytes signature = 15;
}

// Entries of one channel's log, oldest first, and the server's newest position.
message MembershipLog {
  string channel_id = 1;
  repeated MembershipEntry entries = 2;
  LogPosition head = 3;
}

// Asks for log entries from from_seq on. Members and invitees may ask. The
// server sends at most a page (ProtocolInfo.MaxLogEntriesPerPage), and the
// client asks again from where it ends.
message FetchMembershipLog {
  string channel_id = 1;
  uint64 from_seq = 2;
}

message Member {
  User user = 1;
  Rank rank = 2;
  // The user is connected right now. Only for members (rank member and above); always false
  // for invitees, whose presence isn't shared until they join. PresenceChanged keeps it current.
  bool online = 3;
}

// X25519 sealed box: an ephemeral public key and an AEAD ciphertext.
message SealedBox {
  bytes ephemeral_public_key = 1;
  bytes ciphertext = 2;
}

// One copy of an epoch key, sealed to one recipient and signed by its author.
message SealedEpochKey {
  int64 recipient_id = 1;
  SealedBox box = 2;
  // Signature over the recipient, box, key_commitment and log_position (see ChannelCrypto).
  bytes signature = 3;
  // SHA-256 commitment to the epoch key itself (see ChannelCrypto.KeyCommitment).
  // Every copy in a rekey carries the same one, so a recipient whose copy
  // opens to a different key knows the author tried to split the channel.
  bytes key_commitment = 4;
  // The membership log position the key was made for: it is sealed to exactly
  // the members at that position. Signed.
  LogPosition log_position = 5;
  // When the author made the key (Unix ms, by their clock), and their signature over it with the channel, epoch, author,
  // key_commitment and log_position (see ChannelCrypto.KeyCreatedAt): the same in every copy. Message catch-up dates the
  // end of the previous epoch by it: a message under that epoch dated after this key was made (give or take a little)
  // isn't caught up, so keys someone held then can't speak after they left or their place moved. A separate signature,
  // so older clients, which check `signature` alone, still accept the key. Absent from keys made by older clients. Added
  // without a version change.
  int64 created_unix_ms = 6;
  bytes created_signature = 7;
}

// The channel name encrypted under an epoch key and signed by its author.
message EncryptedName {
  uint64 epoch = 1;
  int64 author_id = 2;
  bytes ciphertext = 3;
  bytes signature = 4;
  // Increases with every rename within an epoch (a rekey starts again at 0).
  // Signed, so clients can refuse an older name replayed within the same epoch.
  uint64 revision = 5;
  // Set only by a rekey: the version of the name the rekeyer carried into the
  // new epoch. Signed, so a client that knows that version under another name
  // can tell the rekeyer changed it. Absent for new channels and renames.
  NameSource carried_from = 6;
  // The membership log position the name was made at. Signed.
  LogPosition log_position = 7;
}

message NameSource {
  uint64 epoch = 1;
  uint64 revision = 2;
}

message ChannelInfo {
  string channel_id = 1;
  uint64 epoch = 2;
  // Membership changed since the current epoch; it must be rekeyed before use.
  bool rekey_pending = 3;
  EncryptedName name = 4;
  // The users the server lists as members and invitees, for their names only.
  // Clients take members and ranks from the log.
  repeated Member members = 5;
  // 6 was my_rank: ranks come from the log.
  reserved 6;
  // With rekey_pending: the server asks the viewer to perform the rekey, as RekeyNeeded's
  // designated_user_id would. Lets a member who wasn't told (because the event came before
  // they knew the channel, or while they were offline) act on it.
  bool rekey_designated = 7;
  // The server's newest log position.
  LogPosition log_head = 8;
  // Log entries after the position the client gave in ListChannels (from 0 if none), at
  // most a few (ProtocolInfo.MaxLogEntriesInChannelInfo): fetch the rest with FetchMembershipLog.
  repeated MembershipEntry log = 9;
  // With rekey_pending: as RekeyNeeded's no_key_holder.
  bool no_key_holder = 10;
}

// How much of a channel's log the client already has.
message KnownLog {
  string channel_id = 1;
  // The first entry the client doesn't have.
  uint64 next_seq = 2;
}

message ListChannels {
  repeated KnownLog known = 1;
}

message InviteInfo {
  string channel_id = 1;
  User inviter = 2;
  // The channel name sealed to the invitee by the inviter.
  SealedBox sealed_name = 3;
  // Inviter's signature over the sealed name (channel, invitee, invite entry, sealed name).
  bytes signature = 4;
  int64 created_unix = 5;
  // The invite's entry in the channel's log. The invitee fetches and checks the whole
  // log before trusting it, and checks the signature above with the inviter's key from the log.
  MembershipEntry entry = 6;
}

message ChannelList {
  repeated ChannelInfo channels = 1;
  repeated InviteInfo invites = 2;
}

message CreateChannel {
  // Client-generated (UUID, 32 hex digits) so it can be bound into signatures.
  string channel_id = 1;
  // Epoch 0 key sealed to the creator, for the genesis position.
  SealedEpochKey creator_key = 2;
  EncryptedName name = 3;
  // Entry 0 of the channel's log.
  MembershipEntry genesis = 4;
}

// An invite entry, and the channel name sealed to the invitee.
message InviteMember {
  // 2 was user_id: the entry names the invitee and the keys they're invited with.
  reserved 2;
  string channel_id = 1;
  SealedBox sealed_name = 3;
  bytes signature = 4;
  MembershipEntry entry = 5;
}

// An accept or decline entry.
message RespondToInvite {
  // 2 was accept: the entry's kind says.
  reserved 2;
  string channel_id = 1;
  MembershipEntry entry = 3;
}

// A leave entry.
message LeaveChannel {
  string channel_id = 1;
  MembershipEntry entry = 2;
}

// A remove or cancel-invite entry.
message KickMember {
  reserved 2;
  string channel_id = 1;
  MembershipEntry entry = 3;
}

// A set-rank or transfer-admin entry.
message SetMemberRank {
  reserved 2, 3;
  string channel_id = 1;
  MembershipEntry entry = 4;
}

message DisbandChannel {
  string channel_id = 1;
}

// "Remove from my list", for a channel (or an invite) whose place belongs to identity keys the account no longer has: it
// registered again with new keys before registering moved places along (protocol version 3), so the keys the log knows
// it by are gone and can't sign a leave (or a decline) any more. Not a membership log entry: the log, and every other
// member's view of it, stay as they are (the old keys stay a member, or invited, until a moderator removes them, and
// rekeys still include them). A place removed so is never moved to the account's new keys either. The server only
// stops listing the channel (or invite) to the account and sending it the channel's events, and no longer counts it
// towards the account's limits; the stale place can do nothing else. Refused (FORBIDDEN) while the account is listed in
// the channel under its current keys: leave it, or decline the invite, instead. NOT_FOUND if the account isn't listed in
// the channel. Answered with Ack. Added in 0.2 without a version change: an older server answers "Unknown request.".
message ForgetChannel {
  string channel_id = 1;
}

message RenameChannel {
  string channel_id = 1;
  EncryptedName name = 2;
}

// Moves the channel from epoch N to N+1. Must contain exactly one key per
// member at log_position, which must be the log's head, and a channel name
// encrypted under the new key.
message SubmitRekey {
  string channel_id = 1;
  uint64 new_epoch = 2;
  repeated SealedEpochKey keys = 3;
  EncryptedName name = 4;
  // The new key's commitment. The server rejects the rekey unless every key carries it.
  bytes key_commitment = 5;
  // The log position the rekey was made for. Every key and the name carry it too.
  LogPosition log_position = 6;
}

message FetchEpochKeys {
  string channel_id = 1;
  // Keys for epochs >= this value are returned.
  uint64 from_epoch = 2;
}

message EpochKeyForMe {
  uint64 epoch = 1;
  int64 author_id = 2;
  SealedEpochKey key = 3;
}

message EpochKeys {
  string channel_id = 1;
  repeated EpochKeyForMe keys = 2;
  EncryptedName name = 3;
}

// ---------------------------------------------------------------- messages

message SendMessage {
  string channel_id = 1;
  uint64 epoch = 2;
  // 16 random bytes chosen by the sender; used for de-duplication.
  bytes message_id = 3;
  int64 timestamp_unix_ms = 4;
  // 24-byte nonce followed by the XChaCha20-Poly1305 ciphertext of Content.
  bytes ciphertext = 5;
  // Sender's Ed25519 signature over the message (see ChannelCrypto).
  bytes signature = 6;
}

// Plaintext inside SendMessage.ciphertext. New kinds can be added freely:
// the server never sees them, and clients show unknown kinds as unsupported.
message Content {
  oneof kind {
    TextContent text = 1;
  }
  // Channel messages only: the newest entry of the channel's membership log the
  // sender's client had verified when it sent this (its sequence number, and its
  // hash as MembershipEntries.Hash makes it: the hash the next entry chains to).
  // Receivers compare it with the log they verified, so a server showing members
  // different logs is found through their messages (see "Log heads in messages"
  // in the design doc). Added October 2026; older clients skip the field, and a
  // message without it is taken as before. Absent in local chat.
  LogPosition log_head = 15;
}

message TextContent {
  // The whole message as plain text, each link as its name in square brackets
  // ("look [Potion]"). An older client shows only this.
  string text = 1;
  // Links in the text, in order and not overlapping, each over its bracketed
  // name. Added with chat links (October 2026); older clients skip the field
  // (unknown protobuf fields are ignored) and show the text. A receiver
  // rebuilds a link only from these fields, after checking them against its
  // own game data, and otherwise shows the text.
  repeated TextLink links = 2;
}

message TextLink {
  // Where the link's "[name]" is in text, in UTF-16 code units.
  uint32 start = 1;
  uint32 length = 2;
  oneof target {
    ItemLink item = 3;
    MapLink map = 4;
    StatusLink status = 5;
  }
}

message ItemLink {
  // The game's raw item id: an Item row, +500,000 for a collectable, or
  // +1,000,000 for high quality; 2,000,000 and up is an EventItem row.
  uint32 raw_id = 1;
}

message MapLink {
  // TerritoryType and Map rows, and the position as the game's map links
  // carry it (world coordinates times 1,000).
  uint32 territory_id = 1;
  uint32 map_id = 2;
  sint32 raw_x = 3;
  sint32 raw_y = 4;
}

message StatusLink {
  // A Status row.
  uint32 status_id = 1;
}

// ---------------------------------------------------------------- message catch-up
//
// Capability "history.v1" (ProtocolInfo.Capabilities.History). The server keeps the messages it relays, as the ciphertext
// and signed envelope it relays (which it can't read), for a while, so that a member who was disconnected gets what they
// missed when they come back. Clients check each one as they check a live message (sender, signature, key), and accept
// each at most once (see the design doc, "Message catch-up"). A client only asks a server that agreed to the capability
// in Welcome; an older server would answer "Unknown request.".

// The channel's stored messages after after_id, oldest first, that the asker may read. Only a member gets any (not an
// invitee, a place removed from the user's list, or one under keys the account no longer has), and only messages sent
// under the keys of epochs made since their place last joined (or last moved to new keys), never their own. At most a
// page (ProtocolInfo.MaxStoredMessagesPerPage messages and ProtocolInfo.MaxStoredMessageBytesPerPage of ciphertext); ask
// again from the last one's server_id while StoredMessages.more is set. Each is charged to a per-user read budget.
message FetchMessages {
  string channel_id = 1;
  // The newest ChatMessage.server_id the client has had from this channel; 0 for none.
  uint64 after_id = 2;
  // With after_id 0 only: just what the server stored in the last this many seconds (0: nothing; at most what it keeps).
  uint32 within_seconds = 3;
}

message StoredMessages {
  string channel_id = 1;
  // Oldest first, each with its server_id, all after the one asked from.
  repeated ChatMessage messages = 2;
  // There are more: ask again from the last one's server_id.
  bool more = 3;
  // The newest server_id the channel had when this was answered, whether the asker may read that message or not. With
  // nothing more to come, a client can carry on from it: what it skips is its own, or from before it joined.
  uint64 latest_id = 4;
}

// ---------------------------------------------------------------- local chat
//
// Capability "local.v1" (ProtocolInfo.Capabilities.Local): a /say-like chat among friends who stand near each other in the
// game (see the design doc, "Local chat (friends only)"). The sender's plugin picks the recipients (players near them on
// their friends list, looked up by name), encrypts the message once under a fresh key, seals that key to each recipient's
// identity key and signs each copy. The server only checks the request and passes each copy to the user it names, if they
// are online and agreed to the capability: it stores nothing, and never learns where anyone is. A client only sends it to
// a server that agreed to the capability, and the server only sends LocalMessage to connections that did.

// One local message, and a copy of its key for each recipient.
message SendLocalMessage {
  // 16 random bytes chosen by the sender; used for de-duplication.
  bytes message_id = 1;
  int64 timestamp_unix_ms = 2;
  // 24-byte nonce followed by the XChaCha20-Poly1305 ciphertext of Content, under a key made for this message alone (see
  // LookingGlass.Core.Crypto.LocalCrypto). At most Limits.max_message_bytes, as a channel message.
  bytes ciphertext = 3;
  // One per recipient, each a different user (never the sender), at most Limits.max_local_recipients.
  repeated LocalMessageCopy copies = 4;
  // SHA-256 commitment to the message's key, bound to the sender and message ID (see LocalCrypto.KeyCommitment), signed in
  // every copy: a recipient whose key doesn't match it drops the message, so a sender can't give recipients different keys.
  bytes key_commitment = 5;
}

message LocalMessageCopy {
  int64 recipient_id = 1;
  // The message's key, sealed to the recipient's identity agreement key, bound to the sender, recipient, message ID and time.
  SealedBox sealed_key = 2;
  // The sender's Ed25519 signature over the sender, recipient, message ID, time, the ciphertext's hash, the key commitment
  // and sealed_key (see LocalCrypto), so each recipient checks its own copy without seeing who else got one.
  bytes signature = 3;
}

// A local message for this recipient: their own copy of the key, and the sender's identity as the server has it. The
// recipient checks the signature against the key it already holds for the sender (the server's only on first use), and
// shows it only if the sender is near them in the game and on their friends list. A local message never changes the key
// held for anyone.
message LocalMessage {
  UserIdentity sender = 1;
  bytes message_id = 2;
  int64 timestamp_unix_ms = 3;
  bytes ciphertext = 4;
  SealedBox sealed_key = 5;
  bytes signature = 6;
  bytes key_commitment = 7;
}

// ---------------------------------------------------------------- events

message Announcement {
  string text = 1;
}

message InviteReceived {
  InviteInfo invite = 1;
}

message InviteRevoked {
  string channel_id = 1;
}

// A new entry in the log of a channel the recipient is in. Clients check it
// against their own copy of the log before believing it.
message LogEntryAdded {
  string channel_id = 1;
  MembershipEntry entry = 2;
  // Names of the entry's subject and actor, for display only.
  User subject = 3;
  User actor = 4;
}

message RekeyNeeded {
  // 3 was member_ids: clients rekey for the members in their own verified log.
  reserved 3;
  string channel_id = 1;
  uint64 current_epoch = 2;
  // The member the server asks to perform the rekey. Any member may do it.
  int64 designated_user_id = 4;
  // No member who could make the new key holds the channel's key: every place under its owner's current keys moved there
  // by a key recovered entry (or joined through an invite that moved) and has had no key since, and the rest belong to
  // keys their owners no longer have. Nobody can tell the channel's name, so the member asked makes the new key under a
  // name of its own (which the admin can change). Added with key recovery, in protocol version 3.
  bool no_key_holder = 5;
}

message EpochAdvanced {
  string channel_id = 1;
  uint64 epoch = 2;
  int64 author_id = 3;
  SealedEpochKey my_key = 4;
  EncryptedName name = 5;
}

// A user who is a member of a channel the recipient is also a member of came online (their first
// connection) or went offline (their last connection closed). Sent only to members who share a
// channel with them, never to invitees or strangers, and never about the recipient themselves.
// Also sent, with online set, to a channel's members when an online user joins it.
message PresenceChanged {
  int64 user_id = 1;
  bool online = 2;
}

message ChatMessage {
  string channel_id = 1;
  uint64 epoch = 2;
  int64 sender_id = 3;
  bytes message_id = 4;
  int64 timestamp_unix_ms = 5;
  bytes ciphertext = 6;
  bytes signature = 7;
  // The number the server stored the message under in its channel (message catch-up, capability "history.v1"). Numbers
  // only grow within a channel, in the order the server relayed the messages. A client remembers the newest it has had,
  // and asks for what came after it when it connects again (FetchMessages). The server's word, like the order: clients
  // never rely on it to tell messages apart (they go by message_id and the signed timestamp). 0 if the server didn't
  // store it (an older server, or one keeping none). Added without a version change: older clients skip it.
  uint64 server_id = 8;
}

message ChannelRenamed {
  string channel_id = 1;
  EncryptedName name = 2;
}

enum RemovalReason {
  REMOVAL_REASON_UNSPECIFIED = 0;
  REMOVAL_REASON_LEFT = 1;
  REMOVAL_REASON_KICKED = 2;
  REMOVAL_REASON_DISBANDED = 3;
}

message ChannelRemoved {
  string channel_id = 1;
  RemovalReason reason = 2;
}
