# Weekly dependency updates, one grouped pull request per ecosystem. Security updates still come as they're found.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
      - /tools/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # The Dalamud SDK's major version is the Dalamud API level, which moves with Dalamud itself, by hand.
      - dependency-name: Dalamud.NET.Sdk
        update-types: [version-update:semver-major]
      - dependency-name: DalamudPackager
        update-types: [version-update:semver-major]
      # These follow the .NET version (10); a new major needs a new target framework, by hand.
      - dependency-name: Microsoft.AspNetCore.*
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.Data.Sqlite
        update-types: [version-update:semver-major]
      - dependency-name: System.*
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
